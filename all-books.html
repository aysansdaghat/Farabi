<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>همه کتاب‌ها | انتشارات بنیاد سینمایی فارابی</title>
    <meta name="description" content="مجموعه کامل کتاب‌های انتشارات فارابی">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="site-header"></div>
    <main>
        <section class="sec" id="all-books">
            <div class="wrap">
                <h2 class="sec-title">همه کتاب‌ها</h2>
                <div class="filters">
                    <div class="filter-group" id="cat-group" role="group" aria-label="دسته‌بندی"></div>
                    <div class="filter-group" id="sort-group" role="group" aria-label="مرتب‌سازی">
                        <select id="sort-select">
                            <option value="default">پیش‌فرض</option>
                            <option value="price-asc">قیمت: کم به زیاد</option>
                            <option value="price-desc">قیمت: زیاد به کم</option>
                            <option value="newest">جدیدترین</option>
                            <option value="title">حروف الفبا</option>
                        </select>
                    </div>
                </div>
                <div class="grid" id="all-grid"></div>
                <div class="pagination" id="pagination"></div>
            </div>
        </section>
    </main>
    <div id="site-footer"></div>
    <script src="js/books.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
