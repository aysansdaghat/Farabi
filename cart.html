<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>سبد خرید | انتشارات بنیاد سینمایی فارابی</title>
    <meta name="description" content="سبد خرید شما">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/cart-page.css">
</head>
<body>
    <div id="site-header"></div>
    <main>
        <section class="sec" id="cart-page">
            <div class="wrap">
                <h2 class="sec-title">سبد خرید</h2>
                <div class="cart-layout">
                    <div class="cart-items-section">
                        <div class="cart-table" id="cart-table"></div>
                        <div class="cart-empty" id="cart-empty" style="display: none; text-align: center; padding: 4rem; color: #777;">
                            <p style="font-size: 1.2rem; margin-bottom: 1.5rem;">سبد خرید شما خالی است</p>
                            <a class="btn gold" href="all-books.html">مشاهده کتاب‌ها</a>
                        </div>
                    </div>
                    <aside class="cart-summary">
                        <div class="summary-card">
                            <h3>خلاصه سفارش</h3>
                            <div class="summary-row"><span>مجموع کالا</span><span id="cart-subtotal">۰ تومان</span></div>
                            <div class="summary-row"><span>هزینه ارسال</span><span id="cart-shipping">محاسبه می‌شود</span></div>
                            <div class="summary-row total"><span>مبلغ قابل پرداخت</span><span id="cart-total">۰ تومان</span></div>
                            <button class="btn gold block" id="checkout-btn">پرداخت و تکمیل سفارش</button>
                            <p class="secure-note">خرید شما با درگاه بانکی امن انجام می‌شود</p>
                        </div>
                    </aside>
                </div>
            </div>
        </section>
    </main>
    <div id="site-footer"></div>
    <script src="js/books.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/cart-page.js"></script>
</body>
</html>
